[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Extra build deps may be used by the Vercel 'uv' builder when building wheels from source.
# This helps avoid ModuleNotFoundError: No module named 'pkg_resources' during pandas build.
extra-build-dependencies = { "pandas" = ["pkg_resources"] }
